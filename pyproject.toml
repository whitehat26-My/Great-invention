[project]
name = "restaurant-ai"
version = "0.1.0"
description = "Autonomous AI-driven restaurant operations: 13 agents across 6 departments"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-postgres>=3.1,<4",
    "langchain>=1.3,<2",
    "langchain-anthropic>=1.6,<2",
    "langchain-google-genai>=4.3,<5",
    "fastapi>=0.141,<1",
    "uvicorn[standard]>=0.34",
    "celery>=5.6,<6",
    "redis>=8.1,<9",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.19,<2",
    "psycopg[binary]>=3.3,<4",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.7",
    "typer>=0.15",
    "httpx>=0.28",
    "structlog>=25.1",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.0",
    "fakeredis>=2.37,<3",
    "ruff>=0.9",
    "mypy>=1.14",
]

[project.scripts]
restaurant-ai = "restaurant_ai.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
restaurant_ai = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.11"
packages = ["restaurant_ai"]
ignore_missing_imports = true
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "db: test requires a live PostgreSQL database",
    "integration: end-to-end test across API/worker/agents",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff.lint.per-file-ignores]
# Keyword-style dict() reads better than a literal for these test fixture
# builders, where the keys mirror dataclass field names.
"tests/**" = ["C408"]
